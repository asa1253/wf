name: Update & Deploy Mastery Page
run-name: 刷新精通进度
on:
  schedule:
    - cron: '0 8 * * *'     # 每天 UTC 08:00 自动执行，可按需修改周期
  workflow_dispatch:        # 支持在 Actions 页面手动运行

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  fetch-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests jinja2

      - name: 运行数据抓取与页面生成
        run: python scripts/fetch_mastery.py

      - name: 提交更新
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add index.html data/
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 自动更新精通数据"
          git push

  deploy:
    needs: fetch-and-render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 上传页面产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
